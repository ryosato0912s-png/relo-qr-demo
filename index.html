<style>
  :root{
    --ink:#1A2B33; --teal:#028090; --sea:#00A896; --muted:#6B7C85;
    --line:#D8E0E3; --soft:#F4F8F8; --bg:#EDF1F2; --white:#FFFFFF;
    --line-green:#06C755;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
    color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px;}

  header.top{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:22px;}
  .hdrow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .eyebrow{font-size:12px;letter-spacing:.1em;color:var(--teal);font-weight:800;margin-bottom:6px;}
  h1{font-size:22px;font-weight:800;margin:0;}
  .lead{font-size:13px;color:var(--muted);margin:10px 0 0;}

  .langtoggle{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none;background:#fff;}
  .langtoggle button{border:none;background:#fff;color:var(--muted);font-size:12.5px;font-weight:700;
    padding:7px 13px;cursor:pointer;font-family:inherit;}
  .langtoggle button.on{background:var(--teal);color:#fff;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;}
  @media(max-width:860px){.grid{grid-template-columns:1fr;}}

  .panel{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .phead{background:var(--ink);color:#fff;padding:12px 18px;font-size:13px;font-weight:800;letter-spacing:.03em;}
  .pbody{padding:20px;}
  .pbody.soft{background:var(--soft);}

  /* steps indicator */
  .steps{display:flex;align-items:center;gap:6px;margin-bottom:20px;}
  .steps .st{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#AEB9BD;}
  .steps .st .dot{width:22px;height:22px;border-radius:50%;background:#E3EAEC;color:#9AA7AC;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
  .steps .st.on{color:var(--ink);}
  .steps .st.on .dot{background:var(--teal);color:#fff;}
  .steps .st.done .dot{background:var(--sea);color:#fff;}
  .steps .sep{flex:1;height:1px;background:var(--line);min-width:12px;}

  .sect-title{font-size:15px;font-weight:800;margin:0 0 4px;}
  .sect-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px;}

  /* selectable list */
  .list{display:flex;flex-direction:column;gap:9px;}
  .list.rooms{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 15px;
    border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-family:inherit;
    font-size:14px;color:var(--ink);transition:border-color .12s, background .12s;}
  .rowbtn:hover{border-color:var(--teal);background:var(--soft);}
  .rowbtn.sel{border-color:var(--teal);background:#E7F3F4;}
  .rowbtn .ic{width:30px;height:30px;border-radius:8px;background:#E8F3F4;flex:none;
    display:flex;align-items:center;justify-content:center;}
  .rowbtn .nm{font-weight:700;}
  .rowbtn .ar{margin-left:auto;color:#BFCBCF;font-size:17px;}
  .rowbtn.room{justify-content:center;font-weight:800;font-size:15px;padding:15px 10px;}

  .crumb{font-size:12px;color:var(--muted);margin:0 0 14px;}
  .crumb b{color:var(--ink);font-weight:700;}

  .backbtn{background:none;border:none;color:var(--teal);font-size:13px;font-weight:700;cursor:pointer;
    padding:0;font-family:inherit;margin-bottom:14px;display:inline-flex;align-items:center;gap:5px;}

  /* equipment editor */
  .eqcard{border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:11px;position:relative;}
  .eqcard .eqtop{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .eqcard select{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;
    font-family:inherit;background:#fff;color:var(--ink);}
  .eqcard select:focus{outline:none;border-color:var(--teal);}
  .eqcard .rm{border:none;background:#F3F6F6;color:var(--muted);border-radius:7px;width:30px;height:30px;
    cursor:pointer;font-size:15px;flex:none;}
  .eqcard .rm:hover{background:#FCECEC;color:#C0392B;}
  .eqgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}
  .eqgrid label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin:0 0 3px;}
  .eqgrid input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;
    font-family:inherit;color:var(--ink);background:#fff;}
  .eqgrid input:focus{outline:none;border-color:var(--teal);}

  .addeq{width:100%;padding:11px;border:1.5px dashed var(--line);border-radius:10px;background:#fff;
    color:var(--teal);font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:4px;}
  .addeq:hover{border-color:var(--teal);background:var(--soft);}

  .btn{width:100%;margin-top:18px;padding:13px;border:none;border-radius:9px;background:var(--teal);
    color:#fff;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;}
  .btn:hover{background:#016b78;}

  .qrwrap{text-align:center;margin-top:18px;}
  #qrcode{display:inline-block;padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px;}
  #qrcode img,#qrcode canvas{display:block;}
  .qrcap{font-size:12px;color:var(--muted);margin-top:10px;}

  /* phone preview + result */
  .notch{height:20px;background:#1A2B33;border-radius:0 0 14px 14px;width:110px;margin:0 auto;}
  .phone{width:300px;margin:0 auto;background:#fff;border:10px solid #1A2B33;border-radius:34px;overflow:hidden;
    box-shadow:0 10px 30px rgba(26,43,51,.16);}
  .phone-screen{height:548px;overflow-y:auto;background:#F7FAFA;}
  .empty-phone{padding:70px 26px;text-align:center;color:#AEB9BD;font-size:13px;line-height:1.8;}
  .empty-phone .big{font-size:38px;margin-bottom:10px;}

  .lt-hero{background:linear-gradient(160deg,#028090,#00A896);color:#fff;padding:24px 20px 20px;text-align:center;}
  .lt-badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;
    background:rgba(255,255,255,.2);padding:3px 10px;border-radius:20px;margin-bottom:11px;}
  .lt-prop{font-size:18px;font-weight:800;margin:0 0 2px;}
  .lt-room{font-size:13px;opacity:.92;margin:0;}
  .lt-info{background:#fff;margin:-14px 14px 0;border-radius:12px;box-shadow:0 4px 14px rgba(26,43,51,.1);padding:14px 16px;}
  .lt-info h4{margin:0 0 9px;font-size:11px;font-weight:800;color:var(--teal);letter-spacing:.05em;}
  .lt-eq{border:1px solid #EEF3F3;border-radius:9px;padding:9px 11px;margin-bottom:8px;}
  .lt-eq:last-child{margin-bottom:0;}
  .lt-eq .cat{font-size:13px;font-weight:800;margin-bottom:4px;}
  .lt-eq .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);padding:1px 0;}
  .lt-eq .meta .v{font-weight:700;color:var(--ink);}
  .lt-links{padding:16px 16px 22px;}
  .lt-links .lead2{font-size:11.5px;color:var(--muted);text-align:center;margin:0 0 13px;}
  .lt-btn{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;margin-bottom:11px;border-radius:11px;
    border:1px solid var(--line);background:#fff;text-decoration:none;color:var(--ink);font-size:14px;font-weight:700;}
  .lt-btn .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;}
  .lt-btn .ar{margin-left:auto;color:#C2CDD1;font-size:18px;}
  .lt-btn.line{background:var(--line-green);color:#fff;border-color:var(--line-green);}
  .lt-btn.line .ic{background:rgba(255,255,255,.22);}
  .lt-btn.line .ar{color:rgba(255,255,255,.7);}
  .ic.hp{background:#E8F3F4;} .ic.tel{background:#FBEEDD;}
  .svg-ic{width:18px;height:18px;}

  .foot{margin-top:24px;font-size:11px;color:var(--muted);text-align:center;}
  .tag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:6px;
    padding:2px 9px;font-size:11px;color:#3C4A50;margin:0 3px;}

  /* result standalone page */
  .result-page{max-width:420px;margin:0 auto;min-height:100vh;background:#F7FAFA;}
  .result-top{display:flex;justify-content:flex-end;padding:10px 14px 0;}
</style>
</head>

  // ---------- config ----------
  const LINE_URL = "https://line.me/R/ti/p/@884ypqow";
  const HP_URL   = "https://www.relocreate.co.jp/";
  const TEL      = "0353128717";

  const PROPERTIES = [
    {key:'kyobashi',   ja:'Zanrooハイツ京橋',     en:'Zanroo Heights Kyobashi'},
    {key:'shinagawa',  ja:'Zanrooレジデンス品川', en:'Zanroo Residence Shinagawa'},
    {key:'tsukishima', ja:'Zanrooコート月島',     en:'Zanroo Court Tsukishima'}
  ];
  const ROOMS = ['101','102','201','202','301','302','401','402'];
  const EQUIP_CATS = [
    {key:'aircon',    ja:'エアコン', en:'Air conditioner'},
    {key:'washer',    ja:'洗濯機',   en:'Washing machine'},
    {key:'washbasin', ja:'洗面所',   en:'Washbasin'},
    {key:'bath',      ja:'風呂',     en:'Bathroom'},
    {key:'kitchen',   ja:'台所',     en:'Kitchen'}
  ];

  const I18N = {
    ja:{
      eyebrow:"ZANROO ／ 物件QRコード発行デモ",
      title:"物件・設備情報を持たせたQRを発行する",
      lead:"物件 → 号室 → 設備情報 の順に登録してQRを発行します。居住者がスキャンすると、設備情報つきのリンクページ（LINE／HP／電話）が開きます。",
      stepProp:"物件", stepRoom:"号室", stepInfo:"設備情報",
      adminTitle:"管理者：QRを発行",
      previewTitle:"居住者：スキャン後に開く画面",
      step1Title:"物件を選択", step1Sub:"QRを発行する物件を選んでください。",
      step2Title:"号室を選択",
      step3Title:"設備情報の登録", step3Sub:"この号室に紐づける設備を登録します。設備はプルダウンから選び、追加できます。",
      back:"戻る", roomSuffix:"号室",
      equipHeading:"この号室の設備",
      addEquip:"＋ 設備を追加",
      catLabel:"設備", makerLabel:"メーカー", modelLabel:"型番", yearLabel:"設置年",
      issueQR:"QRを発行する",
      issuedHint:"このQRをスマホのカメラで読み取ってください",
      phoneEmpty:"QRを発行すると、読み取り後に開く画面がここにプレビュー表示されます。",
      resultBadge:"QRから読み込み",
      resultEquipHeading:"紐づく設備情報",
      chooseContact:"お困りごとの連絡先をお選びください",
      lineBtn:"LINEで問い合わせ", hpBtn:"管理会社ホームページ", telBtn:"管理会社へ電話",
      footNote:"※本番ではOnelink方式（QRはそのまま・中身を後から更新可）に拡張可能です。",
      maker_ph:"例：ダイキン", model_ph:"例：AN403ARP-W", year_ph:"例：2023年"
    },
    en:{
      eyebrow:"ZANROO ／ Property QR issuing demo",
      title:"Issue a QR that carries property & equipment info",
      lead:"Register in order: property → room → equipment, then issue a QR. When a resident scans it, a link page (LINE / website / phone) opens with the equipment info.",
      stepProp:"Property", stepRoom:"Room", stepInfo:"Equipment",
      adminTitle:"Admin: issue a QR",
      previewTitle:"Resident: screen shown after scanning",
      step1Title:"Select a property", step1Sub:"Choose the property to issue a QR for.",
      step2Title:"Select a room",
      step3Title:"Register equipment info", step3Sub:"Register the equipment linked to this room. Pick equipment from the dropdown; you can add more.",
      back:"Back", roomSuffix:"",
      equipHeading:"Equipment in this room",
      addEquip:"＋ Add equipment",
      catLabel:"Equipment", makerLabel:"Maker", modelLabel:"Model", yearLabel:"Installed",
      issueQR:"Issue QR",
      issuedHint:"Scan this QR with your phone camera",
      phoneEmpty:"After you issue a QR, the screen shown after scanning will preview here.",
      resultBadge:"Loaded from QR",
      resultEquipHeading:"Linked equipment info",
      chooseContact:"Choose how to contact us",
      lineBtn:"Contact via LINE", hpBtn:"Management company website", telBtn:"Call the management company",
      footNote:"※ In production this can extend to the Onelink method (same QR, contents updatable later).",
      maker_ph:"e.g. Daikin", model_ph:"e.g. AN403ARP-W", year_ph:"e.g. 2023"
    }
  };

  function esc(s){return (s||"").replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
  function propByKey(k){return PROPERTIES.find(p=>p.key===k);}
  function catByKey(k){return EQUIP_CATS.find(c=>c.key===k);}
  function roomLabel(r,lang){return lang==='en' ? ('Room '+r) : (r+'号室');}
  function lineSvg(){return '<svg class="svg-ic" viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.48 2 2 5.73 2 10.33c0 4.12 3.55 7.57 8.34 8.22.33.07.77.22.88.5.1.26.07.66.03.92l-.14.85c-.04.26-.2.99.87.54 1.07-.45 5.77-3.4 7.87-5.82C21.4 14.02 22 12.26 22 10.33 22 5.73 17.52 2 12 2z"/></svg>';}
  function hpSvg(){return '<svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="#028090" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18"/></svg>';}
  function telSvg(){return '<svg class="svg-ic" viewBox="0 0 24 24" fill="#E8A33D"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .7-.2 1l-2.3 2.2z"/></svg>';}
  function homeSvg(){return '<svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="#028090" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg>';}
  function doorSvg(){return '<svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="#028090" stroke-width="2"><rect x="6" y="3" width="12" height="18" rx="1"/><circle cx="14.5" cy="12" r="1" fill="#028090"/></svg>';}

  // ---------- admin state ----------
  const state = { lang:'ja', step:1, propKey:'kyobashi', room:null,
    equip:[ {cat:'aircon', maker:'ダイキン', model:'AN403ARP-W', year:'2023年'} ] };

  function t(){ return I18N[state.lang]; }

  function render(){
    if(isResultView){ renderResultPage(); return; }
    const L=t();
    document.documentElement.lang = state.lang;
    const app=document.getElementById('app');
    app.innerHTML = `
      <div class="wrap">
        <header class="top">
          <div class="hdrow">
            <div>
              <div class="eyebrow">${esc(L.eyebrow)}</div>
              <h1>${esc(L.title)}</h1>
            </div>
            ${langToggleHtml()}
          </div>
          <p class="lead">${esc(L.lead)}</p>
        </header>
        <div class="grid">
          <div class="panel">
            <div class="phead">${esc(L.adminTitle)}</div>
            <div class="pbody">
              ${stepsHtml()}
              <div id="stepbody">${stepBodyHtml()}</div>
            </div>
          </div>
          <div class="panel">
            <div class="phead">${esc(L.previewTitle)}</div>
            <div class="pbody soft">
              <div class="notch"></div>
              <div class="phone"><div class="phone-screen" id="screen">${previewHtml()}</div></div>
            </div>
          </div>
        </div>
        <p class="foot">
          <span class="tag">${state.lang==='en'?'Method A: data embedded in the QR':'方式A：QRにデータを直接埋め込み'}</span>
          <span class="tag">${state.lang==='en'?'Exit: link tree':'出口：リンクツリー'}</span>
          <span class="tag">LINE ID @884ypqow</span><br>${esc(L.footNote)}
        </p>
      </div>`;
    bindLang();
  }

  function langToggleHtml(){
    return `<div class="langtoggle">
      <button data-lang="ja" class="${state.lang==='ja'?'on':''}">日本語</button>
      <button data-lang="en" class="${state.lang==='en'?'on':''}">EN</button>
    </div>`;
  }
  function bindLang(){
    document.querySelectorAll('.langtoggle button').forEach(b=>{
      b.onclick=()=>{ state.lang=b.getAttribute('data-lang'); render(); };
    });
  }

  function stepsHtml(){
    const L=t();
    const cls=n=> state.step===n?'on':(state.step>n?'done':'');
    return `<div class="steps">
      <div class="st ${cls(1)}"><span class="dot">1</span>${esc(L.stepProp)}</div>
      <div class="sep"></div>
      <div class="st ${cls(2)}"><span class="dot">2</span>${esc(L.stepRoom)}</div>
      <div class="sep"></div>
      <div class="st ${cls(3)}"><span class="dot">3</span>${esc(L.stepInfo)}</div>
    </div>`;
  }

  function stepBodyHtml(){
    if(state.step===1) return step1();
    if(state.step===2) return step2();
    return step3();
  }

  function step1(){
    const L=t();
    const rows=PROPERTIES.map(p=>`
      <button class="rowbtn ${state.propKey===p.key?'sel':''}" onclick="selectProp('${p.key}')">
        <span class="ic">${homeSvg()}</span>
        <span class="nm">${esc(p[state.lang])}</span>
        <span class="ar">›</span>
      </button>`).join('');
    return `<p class="sect-title">${esc(L.step1Title)}</p>
      <p class="sect-sub">${esc(L.step1Sub)}</p>
      <div class="list">${rows}</div>`;
  }

  function step2(){
    const L=t(); const p=propByKey(state.propKey);
    const rows=ROOMS.map(r=>`
      <button class="rowbtn room ${state.room===r?'sel':''}" onclick="selectRoom('${r}')">${esc(roomLabel(r,state.lang))}</button>`).join('');
    return `<button class="backbtn" onclick="gotoStep(1)">‹ ${esc(L.back)}</button>
      <p class="crumb"><b>${esc(p[state.lang])}</b></p>
      <p class="sect-title">${esc(L.step2Title)}</p>
      <div class="list rooms">${rows}</div>`;
  }

  function step3(){
    const L=t(); const p=propByKey(state.propKey);
    const eqcards=state.equip.map((e,i)=>{
      const opts=EQUIP_CATS.map(c=>`<option value="${c.key}" ${e.cat===c.key?'selected':''}>${esc(c[state.lang])}</option>`).join('');
      return `<div class="eqcard">
        <div class="eqtop">
          <select onchange="updateEquip(${i},'cat',this.value)">${opts}</select>
          <button class="rm" title="${esc(L.back)}" onclick="removeEquip(${i})">×</button>
        </div>
        <div class="eqgrid">
          <div><label>${esc(L.makerLabel)}</label><input value="${esc(e.maker)}" placeholder="${esc(L.maker_ph)}" oninput="updateEquip(${i},'maker',this.value)"></div>
          <div><label>${esc(L.modelLabel)}</label><input value="${esc(e.model)}" placeholder="${esc(L.model_ph)}" oninput="updateEquip(${i},'model',this.value)"></div>
          <div><label>${esc(L.yearLabel)}</label><input value="${esc(e.year)}" placeholder="${esc(L.year_ph)}" oninput="updateEquip(${i},'year',this.value)"></div>
        </div>
      </div>`;
    }).join('');
    return `<button class="backbtn" onclick="gotoStep(2)">‹ ${esc(L.back)}</button>
      <p class="crumb"><b>${esc(p[state.lang])}</b> ・ <b>${esc(roomLabel(state.room,state.lang))}</b></p>
      <p class="sect-title">${esc(L.step3Title)}</p>
      <p class="sect-sub">${esc(L.step3Sub)}</p>
      <p style="font-size:12px;font-weight:800;color:#3C4A50;margin:0 0 10px;">${esc(L.equipHeading)}</p>
      ${eqcards}
      <button class="addeq" onclick="addEquip()">${esc(L.addEquip)}</button>
      <button class="btn" onclick="issue()">${esc(L.issueQR)}</button>
      <div class="qrwrap" id="qrarea"></div>`;
  }

  // ---------- actions ----------
  window.selectProp=k=>{ state.propKey=k; state.step=2; render(); };
  window.selectRoom=r=>{ state.room=r; state.step=3; render(); };
  window.gotoStep=n=>{ state.step=n; render(); };
  window.addEquip=()=>{ state.equip.push({cat:'washer',maker:'',model:'',year:''}); refreshStep3(); };
  window.removeEquip=i=>{ state.equip.splice(i,1); if(state.equip.length===0) state.equip.push({cat:'aircon',maker:'',model:'',year:''}); refreshStep3(); };
  window.updateEquip=(i,f,v)=>{ state.equip[i][f]=v; updatePreviewOnly(); };

  function refreshStep3(){ document.getElementById('stepbody').innerHTML=step3(); updatePreviewOnly(); }
  function updatePreviewOnly(){ const s=document.getElementById('screen'); if(s) s.innerHTML=previewHtml(); }

  function buildPayloadURL(){
    const base=location.href.split('?')[0].split('#')[0];
    const eq=state.equip.filter(e=>e.cat).map(e=>[e.cat,e.maker,e.model,e.year].join('~')).join(';');
    const q=new URLSearchParams({view:'result',lang:state.lang,prop:state.propKey,room:state.room||'',eq:eq});
    return base+'?'+q.toString();
  }

  window.issue=()=>{
    const url=buildPayloadURL();
    const area=document.getElementById('qrarea');
    area.innerHTML='<div id="qrcode"></div><p class="qrcap">'+esc(t().issuedHint)+'</p>';
    new QRCode(document.getElementById("qrcode"),{text:url,width:200,height:200,colorDark:"#1A2B33",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.L});
    updatePreviewOnly();
  };

  // ---------- preview / result rendering ----------
  function resultData(){
    return { lang:state.lang, prop:state.propKey, room:state.room, equip:state.equip };
  }

  function previewHtml(){
    if(state.step<3 || !state.room){
      return `<div class="empty-phone"><div class="big">📱</div>${esc(t().phoneEmpty)}</div>`;
    }
    return resultInnerHtml(resultData(), state.lang, false);
  }

  // shared renderer for both the in-page preview and the standalone scanned page
  function resultInnerHtml(d, lang, standalone){
    const L=I18N[lang];
    const p=propByKey(d.prop);
    const propName = p? p[lang] : (d.prop||'');
    const eqHtml=(d.equip||[]).filter(e=>e.cat).map(e=>{
      const c=catByKey(e.cat);
      const catName=c? c[lang] : e.cat;
      const rows=[];
      if(e.maker) rows.push(`<div class="meta"><span>${esc(L.makerLabel)}</span><span class="v">${esc(e.maker)}</span></div>`);
      if(e.model) rows.push(`<div class="meta"><span>${esc(L.modelLabel)}</span><span class="v">${esc(e.model)}</span></div>`);
      if(e.year)  rows.push(`<div class="meta"><span>${esc(L.yearLabel)}</span><span class="v">${esc(e.year)}</span></div>`);
      return `<div class="lt-eq"><div class="cat">${esc(catName)}</div>${rows.join('')}</div>`;
    }).join('');
    return `
      <div class="lt-hero">
        <div class="lt-badge">${esc(L.resultBadge)}</div>
        <p class="lt-prop">${esc(propName)}</p>
        <p class="lt-room">${esc(roomLabel(d.room,lang))}</p>
      </div>
      <div class="lt-info">
        <h4>${esc(L.resultEquipHeading)}</h4>
        ${eqHtml || '<div class="lt-eq"><div class="cat" style="color:#AEB9BD;font-weight:600">—</div></div>'}
      </div>
      <div class="lt-links">
        <p class="lead2">${esc(L.chooseContact)}</p>
        <a class="lt-btn line" href="${LINE_URL}"><span class="ic">${lineSvg()}</span>${esc(L.lineBtn)}<span class="ar">›</span></a>
        <a class="lt-btn" href="${HP_URL}"><span class="ic hp">${hpSvg()}</span>${esc(L.hpBtn)}<span class="ar">›</span></a>
        <a class="lt-btn" href="tel:${TEL}"><span class="ic tel">${telSvg()}</span>${esc(L.telBtn)}<span class="ar">›</span></a>
      </div>`;
  }

  // ---------- standalone scanned result page ----------
  let isResultView=false;
  let resultState=null;

  function parseResult(){
    const p=new URLSearchParams(location.search);
    if(p.get('view')!=='result') return null;
    const equip=(p.get('eq')||'').split(';').filter(Boolean).map(s=>{
      const [cat,maker,model,year]=s.split('~');
      return {cat,maker:maker||'',model:model||'',year:year||''};
    });
    return { lang:(p.get('lang')==='en'?'en':'ja'), prop:p.get('prop')||'', room:p.get('room')||'', equip };
  }

  function renderResultPage(){
    const d=resultState;
    document.documentElement.lang=d.lang;
    const app=document.getElementById('app');
    app.innerHTML=`
      <div class="result-page">
        <div class="result-top">
          <div class="langtoggle">
            <button data-lang="ja" class="${d.lang==='ja'?'on':''}">日本語</button>
            <button data-lang="en" class="${d.lang==='en'?'on':''}">EN</button>
          </div>
        </div>
        ${resultInnerHtml(d,d.lang,true)}
      </div>`;
    const p=propByKey(d.prop);
    document.title=(p?p[d.lang]:d.prop)+' '+roomLabel(d.room,d.lang);
    document.querySelectorAll('.langtoggle button').forEach(b=>{
      b.onclick=()=>{ resultState.lang=b.getAttribute('data-lang'); renderResultPage(); };
    });
  }

  // ---------- init ----------
  (function(){
    const r=parseResult();
    if(r){ isResultView=true; resultState=r; render(); }
    else { render(); }
  })();
</script>
</body>
</html>
